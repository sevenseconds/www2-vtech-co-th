<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - CoLabs</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
</head>

<body>
  <div id="login-container"
    style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
    <h1 style="color: #1e3a8a;">CoLabs Admin</h1>
    <form id="login-form" style="display: flex; flex-direction: column; gap: 10px; width: 300px;">
      <input type="email" id="email" placeholder="Email" required
        style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      <input type="password" id="password" placeholder="Password" required
        style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      <button type="submit"
        style="padding: 12px; background: #1e3a8a; color: white; border: none; border-radius: 4px; cursor: pointer;">Login</button>
    </form>
    <p id="error-message" style="color: red; margin-top: 10px;"></p>
  </div>

  <div id="logout-bar" style="display: none; position: fixed; top: 10px; right: 10px; z-index: 9999;">
    <button id="logout-btn"
      style="padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-family: sans-serif;">Logout</button>
  </div>

  <script>
    // --- FIREBASE CONFIGURATION ---
    // User needs to fill this in from Firebase Console
    const firebaseConfig = {
      apiKey: "AIzaSyDolFBpaFRVO7slQU9uV16EuE9Y-5wQtMs",
      authDomain: "vtech-innovation.firebaseapp.com",
      projectId: "vtech-innovation",
      storageBucket: "vtech-innovation.firebasestorage.app",
      messagingSenderId: "190926179090",
      appId: "1:190926179090:web:52f8e70dbaf56db96e01cb",
      measurementId: "G-QVQC6DB8L1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');
    const logoutBar = document.getElementById('logout-bar');
    const logoutBtn = document.getElementById('logout-btn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        errorMessage.innerText = error.message;
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await auth.signOut();
      localStorage.removeItem('decap-cms-user');
      window.location.reload();
    });

    // --- DECAP CMS INTEGRATION ---
    let cmsLoaded = false;

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        document.getElementById('login-container').style.display = 'none';
        logoutBar.style.display = 'block';

        // Get the ID Token to pass to Decap CMS
        const idToken = await user.getIdToken();

        // Set user in localStorage so Decap CMS picks it up
        const userObj = JSON.stringify({
          token: idToken,
          email: user.email,
          backendName: 'git-gateway'
        });

        localStorage.setItem('decap-cms-user', userObj);
        localStorage.setItem('netlify-cms-user', userObj);

        // Load Decap CMS script dynamically
        if (!cmsLoaded) {
          const script = document.createElement('script');
          script.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
          document.body.appendChild(script);
          cmsLoaded = true;
        }
      } else {
        document.getElementById('login-container').style.display = 'flex';
        logoutBar.style.display = 'none';
      }
    });
  </script>
</body>

</html>
