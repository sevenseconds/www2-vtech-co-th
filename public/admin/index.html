<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - CoLabs</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
</head>

<body>
  <div id="login-container"
    style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
    <h1 style="color: #1e3a8a;">CoLabs Admin</h1>
    <div id="firebaseui-auth-container"></div>
    <form id="login-form" style="display: flex; flex-direction: column; gap: 10px; width: 300px;">
      <input type="email" id="email" placeholder="Email" required
        style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      <input type="password" id="password" placeholder="Password" required
        style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      <button type="submit"
        style="padding: 12px; background: #1e3a8a; color: white; border: none; border-radius: 4px; cursor: pointer;">Login</button>
    </form>
    <p id="error-message" style="color: red; margin-top: 10px;"></p>
    <button id="logout" style="display: none; margin-top: 20px;">Logout</button>
  </div>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // --- FIREBASE CONFIGURATION ---
    // User needs to fill this in from Firebase Console
    const firebaseConfig = {
      apiKey: "AIzaSyDolFBpaFRVO7slQU9uV16EuE9Y-5wQtMs",
      authDomain: "vtech-innovation.firebaseapp.com",
      projectId: "vtech-innovation",
      storageBucket: "vtech-innovation.firebasestorage.app",
      messagingSenderId: "190926179090",
      appId: "1:190926179090:web:52f8e70dbaf56db96e01cb",
      measurementId: "G-QVQC6DB8L1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        errorMessage.innerText = error.message;
      }
    });

    // --- DECAP CMS INTEGRATION ---
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        document.getElementById('login-container').style.display = 'none';

        // Get the ID Token to pass to Decap CMS
        const idToken = await user.getIdToken();

        // Custom Authenticator for Decap CMS
        // Since we are using git-gateway, CMS will look for a token in localStorage
        // or provided by an authenticator.
        localStorage.setItem('decap-cms-user', JSON.stringify({
          token: idToken,
          email: user.email,
          backendName: 'git-gateway'
        }));

        // Refresh the page or trigger CMS to load
        // CMS usually initializes on load, but since we are already here
        // if user logged in, we let it proceed.
      } else {
        document.getElementById('login-container').style.display = 'flex';
      }
    });
  </script>
</body>

</html>
